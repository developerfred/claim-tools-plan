[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"

# Optimizer settings
optimizer = true
optimizer_runs = 200

# Test settings
verbosity = 3
gas_reports = ["*"]

# RPC endpoints
[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

# Etherscan
[etherscan]
base = { key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api" }
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }

# Fmt
[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
multiline_func_header = "all"
